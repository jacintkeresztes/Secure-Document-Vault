<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1.0">
    <title>Secure Document Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Document Vault</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/upload">Upload</a>
                <a class="nav-link" href="/register">Register</a>
                <a class="nav-link" href="/login">Login</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <!-- For Non-Logged In Users -->
        <div id="guest-view">
            <div class="text-center">
                <h1 class="display-4">Secure Your Documents in the Cloud</h1>
                <p class="lead">Store, manage, and access your files securely from anywhere.</p>
                <a href="/login" class="btn btn-primary btn-lg mt-3">Login / Register Now</a>
            </div>
        </div>

        <!-- For Logged In Users (hidden by default) -->
        <div id="user-view" style="display: none;">
            <h2>Your Documents</h2>
            <table class="table table-striped mt-4">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Size</th>
                        <th>Upload Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>document1.pdf</td>
                        <td>2.4 MB</td>
                        <td>2025-11-28</td>
                        <td>
                            <button class="btn btn-sm btn-primary">Download</button>
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </td>
                    </tr>
                    <!-- More files will be added dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../public/js/index.js"></script>
</body>
</html>
