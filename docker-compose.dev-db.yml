version: '3.8'

# Use this for local development: docker-compose -f docker-compose.dev-db.yml up -d
# Then run backend locally with: cd backend && npm run dev:local:watch

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: vault-mysql-dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=vault_db
      - MYSQL_USER=vault_user
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_MAX_CONNECTIONS=200
      - MYSQL_INNODB_BUFFER_POOL_SIZE=256M
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --require_secure_transport=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: vault-adminer-dev
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql-dev-data:
    driver: local
