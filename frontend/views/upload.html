<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - Secure Document Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .upload-box {
            border: 3px dashed #ccc;
            border-radius: 10px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-box:hover {
            border-color: #0d6efd;
            background-color: #f8f9fa;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Document Vault</a>
            <div class="navbar-nav ms-auto">
                <!-- Links populated by JavaScript -->
            </div>
        </div>
    </nav>

    <!-- Upload Area -->
    <div class="container mt-5">
        <h2 class="text-center mb-4">Upload Your Documents</h2>

        <div class="upload-box" id="uploadBox">
            <h3>Click to select files or drag and drop here</h3>
            <p class="text-muted mt-3">Supported formats: PDF, DOC, DOCX, TXT, Images</p>
            <input type="file" id="fileInput" multiple>
        </div>

        <div class="mt-4" id="fileList">
            <!-- Selected files will appear here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/auth.js"></script>
    <script src="/public/js/navbar.js"></script>
    <script src="/public/js/upload.js"></script>
</body>
</html>
