server {
      listen 80;
      server_name localhost;
      root /usr/share/nginx/html/views;
      index index.html;

      # Serve HTML pages
      location / {
          try_files $uri $uri.html $uri/ /index.html;
      }

      # Serve static files (CSS, JS, images) from parent directory
      location /public {
          alias /usr/share/nginx/html/public;
          try_files $uri =404;
      }
  }