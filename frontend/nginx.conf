server {
      listen 80;
      server_name localhost;
      root /usr/share/nginx/html/views;
      index index.html;

      location / {
          try_files $uri $uri.html $uri/ /index.html;
      }

      location /public {
          alias /usr/share/nginx/html/public;
          try_files $uri =404;
      }
  }